# ============================================================================
# Spring Boot Application Properties
# Restaurant Table-Ordering System (Spring Boot 3 + Spring JDBC)
# ============================================================================

# Application & Server
spring.application.name=restaurant-ordering-system
server.port=${PORT:8080}

# Database Connection (Spring JDBC JdbcTemplate)
# Credentials come from environment variables (Rule 9) or from the git-ignored
# config/local.properties (created by each developer, never committed).
# connectionTimeZone=UTC + forceConnectionTimeZoneToSession=true pins the MySQL *session*
# time zone to UTC, so CURRENT_TIMESTAMP is stored/read as UTC and every timestamp we
# serialise with a trailing 'Z' really is UTC (contract: "All timestamps are ISO-8601 UTC").
spring.config.import=optional:file:./config/local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:restaurant_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=RestaurantHikariPool

# Logging Configuration
logging.level.root=INFO
logging.level.com.restaurant=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
